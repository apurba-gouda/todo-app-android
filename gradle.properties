# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in offline mode and will not attempt to
# download dependencies from the network.
# org.gradle.offline=true

# Android properties
android.useAndroidX=true
android.enableJetifier=true

# Kotlin properties
kotlin.code.style=official

# Enable parallel build
org.gradle.parallel=true
org.gradle.caching=true